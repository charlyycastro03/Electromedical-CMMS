<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electromedical CMMS — Acceso</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--border:#30363d;
      --primary:#7c86ff;--text:#e6edf3;--muted:#8b949e;
      --danger:#f85149;--success:#3fb950;
    }
    body{
      font-family:'Segoe UI',system-ui,sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      background-image:radial-gradient(ellipse at 20% 50%,rgba(124,134,255,.07) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 20%,rgba(34,211,238,.05) 0%,transparent 60%);
      padding:1rem;
    }
    .card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:16px;padding:2.2rem;width:100%;max-width:420px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .logo{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;justify-content:center;}
    .logo img{width:44px;height:44px;border-radius:10px;object-fit:cover;}
    .logo-text h1{font-size:1.2rem;font-weight:700;}
    .logo-text p{font-size:.75rem;color:var(--muted);}
    h2{font-size:1.05rem;font-weight:600;margin-bottom:.3rem;}
    .subtitle{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem;}
    .form-group{margin-bottom:.9rem;}
    label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.05em;}
    input,select{
      width:100%;padding:.65rem .9rem;
      background:#0d1117;border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:.9rem;
      transition:border-color .2s,box-shadow .2s;font-family:inherit;
    }
    input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,134,255,.15);}
    select option{background:#161b22;}
    .btn{
      width:100%;padding:.75rem;background:var(--primary);
      border:none;border-radius:8px;color:#fff;
      font-size:.95rem;font-weight:600;cursor:pointer;
      transition:opacity .2s;margin-top:.4rem;font-family:inherit;
    }
    .btn:hover{opacity:.9;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
    .btn-ghost:hover{border-color:var(--primary);color:var(--primary);opacity:1;}
    .msg{border-radius:8px;padding:.65rem 1rem;font-size:.85rem;margin-top:.9rem;display:none;}
    .msg.error{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--danger);}
    .msg.success{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);color:var(--success);}
    .divider{display:flex;align-items:center;gap:.75rem;margin:1.2rem 0;}
    .divider::before,.divider::after{content:'';flex:1;border-top:1px solid var(--border);}
    .divider span{font-size:.75rem;color:var(--muted);}
    .switch-link{
      text-align:center;font-size:.82rem;color:var(--muted);margin-top:1rem;
    }
    .switch-link button{
      background:none;border:none;color:var(--primary);
      cursor:pointer;font-size:.82rem;font-weight:600;
      text-decoration:underline;
    }
    .empresa-field{display:none;}
    .role-note{font-size:.75rem;color:var(--muted);margin-top:.3rem;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='10' fill='%231e3a5f'/%3E%3Ctext x='22' y='30' text-anchor='middle' font-size='22' fill='%237c86ff'%3E🏥%3C/text%3E%3C/svg%3E" alt="Logo"/>
    <div class="logo-text">
      <h1>Electromedical</h1>
      <p>Sistema de Gestión Biomédica</p>
    </div>
  </div>

  <!-- ── PANEL LOGIN ── -->
  <div id="panel-login">
    <h2>Bienvenido</h2>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>
    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="l-email" placeholder="usuario@electromedical.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="l-password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" id="btn-login" onclick="login()">Iniciar sesión</button>
    <div class="msg error" id="login-error"></div>
    <div class="switch-link">
      ¿No tienes cuenta? <button onclick="showPanel('register')">Regístrate aquí</button>
    </div>
  </div>

  <!-- ── PANEL REGISTRO ── -->
  <div id="panel-register" style="display:none">
    <h2>Crear cuenta</h2>
    <p class="subtitle">Completa tus datos para registrarte</p>
    <div class="form-group">
      <label>Nombre completo *</label>
      <input type="text" id="r-nombre" placeholder="Nombre Apellido"/>
    </div>
    <div class="form-group">
      <label>Correo electrónico *</label>
      <input type="email" id="r-email" placeholder="correo@ejemplo.com"/>
    </div>
    <div class="form-group">
      <label>Contraseña *</label>
      <input type="password" id="r-password" placeholder="Mínimo 6 caracteres"/>
    </div>
    <div class="form-group">
      <label>Tipo de cuenta *</label>
      <select id="r-rol" onchange="toggleEmpresa()">
        <option value="cliente">🏥 Cliente (Hospital / Clínica)</option>
        <option value="usuario">🔧 Usuario (Ingeniero Biomédico)</option>
      </select>
      <p class="role-note">El rol de Administrador solo puede ser asignado por un admin existente.</p>
    </div>
    <div class="form-group empresa-field" id="empresa-field">
      <label>Hospital o empresa *</label>
      <input type="text" id="r-empresa" placeholder="Ej: Hospital Regional del Norte"/>
    </div>
    <button class="btn" id="btn-register" onclick="register()">Crear cuenta</button>
    <div class="msg error"   id="register-error"></div>
    <div class="msg success" id="register-success"></div>
    <div class="switch-link">
      ¿Ya tienes cuenta? <button onclick="showPanel('login')">Inicia sesión</button>
    </div>
  </div>
</div>

<script>
  fetch('/api/auth/me', {credentials:'include'}).then(r=>r.json()).then(d=>{ if(d.autenticado) window.location.href='/'; });

  function showPanel(name) {
    document.getElementById('panel-login').style.display    = name==='login'    ? 'block' : 'none';
    document.getElementById('panel-register').style.display = name==='register' ? 'block' : 'none';
  }

  function toggleEmpresa() {
    const rol = document.getElementById('r-rol').value;
    document.getElementById('empresa-field').style.display = rol==='cliente' ? 'block' : 'none';
  }
  toggleEmpresa();

  document.getElementById('l-password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

  async function login() {
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    const email    = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-password').value;
    if (!email||!password){ err.textContent='Completa todos los campos.'; err.style.display='block'; return; }
    btn.disabled=true; btn.textContent='Verificando...';
    const res  = await fetch('/api/auth/login',{ method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({email,password}) });
    const data = await res.json();
    if(res.ok){ window.location.href='/'; }
    else{ err.textContent=data.error||'Error al iniciar sesión.'; err.style.display='block'; btn.disabled=false; btn.textContent='Iniciar sesión'; }
  }

  async function register() {
    const btn = document.getElementById('btn-register');
    const err = document.getElementById('register-error');
    const suc = document.getElementById('register-success');
    err.style.display='none'; suc.style.display='none';

    const nombre   = document.getElementById('r-nombre').value.trim();
    const email    = document.getElementById('r-email').value.trim();
    const password = document.getElementById('r-password').value;
    const rol      = document.getElementById('r-rol').value;
    const empresa  = document.getElementById('r-empresa').value.trim();

    if(!nombre||!email||!password){ err.textContent='Completa todos los campos obligatorios.'; err.style.display='block'; return; }
    if(rol==='cliente'&&!empresa){ err.textContent='Indica el nombre de tu hospital o empresa.'; err.style.display='block'; return; }
    if(password.length<6){ err.textContent='La contraseña debe tener al menos 6 caracteres.'; err.style.display='block'; return; }

    btn.disabled=true; btn.textContent='Creando cuenta...';
    const res  = await fetch('/api/auth/register',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nombre,email,password,rol,empresa}) });
    const data = await res.json();

    if(res.ok){
      suc.textContent='✅ Cuenta creada. Redirigiendo...'; suc.style.display='block';
      // Auto-login
      await fetch('/api/auth/login',{ method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body:JSON.stringify({email,password}) });
      setTimeout(()=>window.location.href='/', 1000);
    } else {
      err.textContent=data.error||'Error al crear la cuenta.'; err.style.display='block';
      btn.disabled=false; btn.textContent='Crear cuenta';
    }
  }
</script>
</body>
</html>
